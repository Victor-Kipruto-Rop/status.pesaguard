<!-- Uptime Card Component — REFERENCE TEMPLATE
     Documents the DOM js/uptime.js builds per service. Not fetched at runtime.
     .uptime-percent renders "Not available" when no measurement exists. -->
<div class="uptime-status-card" data-service-id="{id}">
  <div class="service-name">
    <span class="uptime-dot operational"></span>
    <span class="uptime-service-name">Service name</span>
  </div>
  <div class="uptime-summary">
    <span class="uptime-percent">99.99%</span>
    <span class="uptime-meta">30d</span>
  </div>
</div>
