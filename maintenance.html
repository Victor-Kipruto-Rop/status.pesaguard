    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>

<body data-path="/maintenance.html" class="status-page maintenance">
  <a class="visually-hidden" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <div class="status-shell">
      <section class="maintenance-header">
        <p class="status-eyebrow">Scheduled maintenance</p>
        <h1>Maintenance</h1>
        <p class="status-hero-subtitle">
          Planned maintenance windows and completed history for PesaGuard services.
          Windows appear here as soon as they are scheduled, and move to the
          history section once they finish.
        </p>
      </section>

      <section class="maintenance-section reveal" aria-labelledby="maintenance-active-title">
        <h2 class="maintenance-section-title" id="maintenance-active-title" data-tone="in-progress">In progress</h2>
        <div id="active-maintenance">
          <!-- Populated by js/maintenance.js -->
        </div>
      </section>

      <section class="maintenance-section reveal" aria-labelledby="maintenance-upcoming-title">
        <h2 class="maintenance-section-title" id="maintenance-upcoming-title" data-tone="scheduled">Upcoming</h2>
        <div id="upcoming-maintenance">
          <!-- Populated by js/maintenance.js -->
        </div>
      </section>

      <section class="maintenance-section reveal" aria-labelledby="maintenance-completed-title">
        <h2 class="maintenance-section-title" id="maintenance-completed-title" data-tone="completed">Completed</h2>
        <div id="maintenance-history">
          <!-- Populated by js/maintenance.js -->
        </div>
      </section>

      <div class="maintenance-back">
        <a href="index.html" class="status-back-link"><span class="arrow" aria-hidden="true">&larr;</span> Back to status</a>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/maintenance.js" defer></script>
</body>
</html>
