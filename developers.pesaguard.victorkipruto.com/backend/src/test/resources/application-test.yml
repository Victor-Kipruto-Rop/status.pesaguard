spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/pesaguard_developer_platform_test}
    username: ${TEST_DATABASE_USERNAME:postgres}
    password: ${TEST_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true

# Test-only. The mail health contributor probes a live SMTP connection, but the
# suites replace JavaMailSender with a stub so registration does not try to reach a
# mail host that does not exist in a test run. The indicator then fails to build and
# takes the whole application context down with it, so it is switched off here.
management:
  health:
    mail:
      enabled: false

pesaguard:
  json-web-token:
    # THROWAWAY TEST KEYS, GENERATED FOR THIS FILE ONLY.
    # These are not secrets and protect nothing: they exist so the RS256
    # signing/verification path runs for real in tests, including the negative
    # cases that must reject an unsigned or wrongly-signed token. A production
    # deployment supplies its own pair from a secrets manager and never reads
    # this file. Regenerate freely; nothing depends on these particular bytes.
    key-id: test-v1
    private-key: 
    public-key: 
  security:
    registration-enabled: true
    # Argon2 at the contract floor for the same reason as bcrypt-strength below:
    # the production figures are deliberately slow, and a suite that hashes at the
    # real work factor spends its time in KDF rather than in the behaviour under
    # test. Test-only; never used outside this profile.
    #
    # 64 KiB, not a rounder-looking number: ApplicationProperties enforces a
    # @Min(64) floor on the memory cost, so the previously configured 8 KiB would
    # fail validation on any profile that actually validates properties.
    argon2-memory-kilobytes: 64
    argon2-iterations: 1
    argon2-parallelism: 1
    # Must satisfy the @Min(10) floor in ApplicationProperties. The work factor is
    # deliberately the lowest the contract allows so the suite stays fast; this is
    # a test-only value and is never used outside the test profile.
    bcrypt-strength: 10
    account-login-failure-limit: 3
    ip-login-failure-limit: 10
    login-failure-window: PT15M
    invitation-accept-attempt-limit: 50
    invitation-accept-window: PT15M
  usage:
    # Off during tests: a background rollup would race the suite and make
    # results depend on timing.
    rollup-enabled: false
  platform:
    # Required by ApplicationProperties (@NotBlank). A distinct test-only value: the
    # operator surface must never be reachable with the credential or audit key.
    operator-hmac-key: dGVzdC1vcGVyYXRvci1obWFjLWtleS0zMi1ieXRlcy1sb25nISE=
  messaging:
    # No broker in tests. The outbox still records events; the relay finds no
    # publisher and leaves rows PENDING.
    enabled: false
    outbox:
      # Off: a background drain would race the suite and make results depend
      # on timing, and could publish rows another test is asserting on.
      relay-enabled: false
