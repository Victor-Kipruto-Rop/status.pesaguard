    PromoteEnvironment: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PromoteEnvironmentRequest'}}}}
    CreateRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRoleRequest'}}}}
    UpdateRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateRoleRequest'}}}}
    GrantRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrantRoleRequest'}}}}
    RequestProductionAccess: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequestProductionAccessRequest'}}}}
    CreateSupportTicket: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSupportTicketRequest'}}}}
    SupportArticleFeedback: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportArticleFeedbackRequest'}}}}
    ReviewProductionAccess: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductionAccessReviewRequest'}}}}
    CreateApiKey: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApiKeyRequest'}}}}
    CreateApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationRequest'}}}}
    UpdateApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateApplicationRequest'}}}}
    VerifyApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyApplicationRequest'}}}}
    AuthorizationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationRequestBody'}}}}
    TokenRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenRequestBody'}}}}
    AssignScopes: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignScopesRequest'}}}}
    DeprecateScope: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeprecateScopeRequest'}}}}
    CreateSandbox: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSandboxRequest'}}}}
    UpdateSandboxLimits: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSandboxLimitsRequest'}}}}
  responses:
    RegistrationCreated: {description: Account created; verification email sent and no session issued, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationEnvelope'}}}}
    AuthCreated: {description: Created; access token is returned once, content: {application/json: {schema: {$ref: '#/components/schemas/AuthEnvelope'}}}}
    Auth: {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/AuthEnvelope'}}}}
    KeyCreated: {description: One-time API key response; never cached, headers: {Cache-Control: {schema: {type: string, example: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/KeyEnvelope'}}}}
    Data: {description: Successful response envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    CsvExport: {description: CSV download with private caching disabled and a truncation indicator, headers: {Content-Disposition: {schema: {type: string}}, Cache-Control: {schema: {type: string, example: no-store}}, X-Export-Truncated: {description: Whether the 5,000-row limit omitted matching rows, schema: {type: boolean}}}, content: {text/csv: {schema: {type: string, format: binary}}}}
    NotificationPage: {description: Paginated notification inbox, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPageEnvelope'}}}}
    Notification: {description: Updated notification, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationEnvelope'}}}}
    NotificationsMarkedRead: {description: Number of notifications marked read, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationsMarkedReadEnvelope'}}}}
    NotificationPreferences: {description: Saved notification preferences, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferencesEnvelope'}}}}
    EnvironmentList: {description: Project environments with their server-assigned API Base URLs, content: {application/json: {schema: {$ref: '#/components/schemas/EnvironmentListEnvelope'}}}}
    EnvironmentDetail: {description: Environment details with its server-assigned API Base URL, content: {application/json: {schema: {$ref: '#/components/schemas/EnvironmentEnvelope'}}}}
    Error: {description: Structured client error. An API_KEY_ENVIRONMENT_MISMATCH error means the presented environment-bound API key was sent to the wrong official API host., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    RateLimited: {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    InvitationCreated: {description: Invitation created and queued for email delivery; its bearer token is never returned by the administrative API and is encrypted while queued, headers: {Cache-Control: {schema: {type: string, example: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreatedEnvelope'}}}}
