openapi: 3.1.0
info:
  title: PesaGuard Developer Platform API
  version: 0.1.0
  description: Secure developer-platform API, including organization-scoped invoices and payment initiation. The sandbox transactions endpoint remains read-only; no production transaction payment execution is exposed.
servers:
  - {url: 'https://api.pesaguard.co.ke', description: Production API}
  - {url: 'http://localhost:8080', description: Local development}
security:
  - {bearerAuth: []}
paths:
  /api/v1/status:
    get: {security: [], description: 'Public-safe component status, active public incidents, and configured maintenance messaging. No infrastructure topology is exposed.', responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/status/incidents:
    get: {security: [], description: 'Public incident history with public updates only.', responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/changelog:
    get: {security: [], description: 'Lists published developer-platform release notes only, newest first. Draft entries are never returned.', responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/events:
    get: {description: 'Lists outbox event metadata in the requested project environment. Results are organization and project-access scoped and use zero-based pagination.', parameters: [{name: projectId, in: query, required: true, schema: {type: string, format: uuid}}, {name: environmentId, in: query, required: true, schema: {type: string, format: uuid}}, {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/events/subscriptions:
    get: {description: 'Lists event subscriptions in the requested project environment with page metadata.', parameters: [{name: projectId, in: query, required: true, schema: {type: string, format: uuid}}, {name: environmentId, in: query, required: true, schema: {type: string, format: uuid}}, {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/events/deliveries:
    get: {description: 'Lists webhook delivery attempts in the requested project environment with page metadata.', parameters: [{name: projectId, in: query, required: true, schema: {type: string, format: uuid}}, {name: environmentId, in: query, required: true, schema: {type: string, format: uuid}}, {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/ecosystem/sdk-releases:
    get: {security: [], description: 'Lists immutable SDK release metadata, including checksums and compatibility ranges.', responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/ecosystem/sdk-releases/{language}/recommended:
    get: {security: [], description: 'Returns the newest compatible supported SDK release for the requested API major.', parameters: [{name: language, in: path, required: true, schema: {type: string}}, {name: apiMajor, in: query, schema: {type: integer, minimum: 1}}], responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/ecosystem/cli-releases:
    get: {security: [], description: 'Lists immutable CLI artefact metadata and SHA-256 checksums.', responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/ecosystem/cli-releases/recommended:
    get: {security: [], description: 'Returns a downloadable CLI build for a platform and architecture.', parameters: [{name: platform, in: query, required: true, schema: {type: string}}, {name: architecture, in: query, required: true, schema: {type: string}}, {name: channel, in: query, schema: {type: string, default: STABLE}}], responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/platform/status:
    get: {security: [], description: 'Public, read-only platform runtime state. Includes maintenance messaging and frontend feature availability; server-side feature checks remain authoritative.', responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/auth/register:
    post: {security: [], description: 'Creates an account and organization, then emails a single-use six-digit verification code valid for 10 minutes. The response includes the server-issued expiry and resend timestamps. No session is created until email verification and login succeed.', requestBody: {$ref: '#/components/requestBodies/Register'}, responses: {'201': {$ref: '#/components/responses/RegistrationCreated'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/login:
    post: {security: [], description: 'Validates the password before issuing an email OTP challenge for an unverified address. EMAIL_NOT_VERIFIED includes server-issued expiry and resend timestamps only after password verification. Enforced MFA for an unenrolled user returns MFA_ENROLLMENT_REQUIRED with a short-lived token restricted to MFA setup and confirmation; no normal session or refresh token is issued until a valid TOTP is confirmed.', requestBody: {$ref: '#/components/requestBodies/Login'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/auth/verify-email:
    post: {security: [], description: 'Checks an email-bound six-digit code issued for 10 minutes; legacy verification links remain accepted during migration.', requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {email: {type: string, format: email, maxLength: 320}, code: {type: string, pattern: '^[0-9]{6}$'}, token: {type: string, maxLength: 512}}, anyOf: [{required: [email, code]}, {required: [token]}]}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '410': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/auth/verify-email/resend:
    post: {security: [], description: 'Resends a verification code, invalidating the prior code, with a 60-second per-account cooldown. Does not reveal whether an address exists or is already verified.', requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email, maxLength: 320}}}}}}, responses: {'202': {description: Accepted}, '503': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/logout:
    post: {description: 'Ends the caller''s access session and the refresh family backing it. Revoking only the access token would leave a live refresh token able to mint a new session.', responses: {'204': {description: Session revoked}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/refresh:
    post: {security: [], description: 'Rotates a refresh token and returns a fresh access session alongside the new refresh token. A token may be presented exactly once: replaying one revokes its entire family and returns 401.', requestBody: {$ref: '#/components/requestBodies/Refresh'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/sessions:
    get: {description: 'The caller''s live sessions, most recently active first.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/sessions/{sessionId}:
    delete: {description: 'Ends one of the caller''s own sessions and its refresh family. Returns 404 for a session that does not exist or belongs to another user, so ids cannot be probed.', parameters: [{$ref: '#/components/parameters/SessionId'}], responses: {'204': {description: Revoked}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/forgot-password:
    post: {security: [], description: 'Starts a password reset. Always answers 202 with no body so it cannot be used to discover which addresses are registered.', requestBody: {$ref: '#/components/requestBodies/ForgotPassword'}, responses: {'202': {description: Accepted regardless of whether the address exists}}}
  /api/v1/auth/reset-password:
    post: {security: [], description: 'Completes a password reset. Ends every access session and refresh family for the account, in every organization.', requestBody: {$ref: '#/components/requestBodies/ResetPassword'}, responses: {'204': {description: Password changed}, '400': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/change-password:
    post: {description: 'Changes the caller''s password. Requires the current password and ends other sessions and all refresh families.', requestBody: {$ref: '#/components/requestBodies/ChangePassword'}, responses: {'204': {description: Password changed}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/mfa/status:
    get: {description: 'Whether the caller has a confirmed second factor.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/mfa/enroll:
    post: {description: 'Begins TOTP enrolment and returns the secret and otpauth URI once. The factor stays inert until /confirm succeeds. A restricted MFA enrollment challenge may call this endpoint but cannot call other authenticated APIs.', responses: {'201': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/mfa/confirm:
    post: {description: 'Confirms enrolment with a valid code and returns recovery codes exactly once; only hashes are retained. When completing a restricted login challenge, the response also contains the newly issued full access and refresh session.', requestBody: {$ref: '#/components/requestBodies/MfaCode'}, responses: {'201': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/mfa/disable:
    post: {description: 'Removes the second factor and its recovery codes.', responses: {'204': {description: Disabled}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/session:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/onboarding/bootstrap:
    post: {description: 'Atomically creates a project, applies the selected starter template, creates an active SANDBOX environment and sandbox, then returns a transactions:read API key once. Requires an authenticated developer session; the raw key is never stored or returned again.', requestBody: {$ref: '#/components/requestBodies/BootstrapDeveloperWorkspace'}, responses: {'201': {$ref: '#/components/responses/DeveloperWorkspaceCreated'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/onboarding/status:
    get: {description: 'Checks active account, verified email, profile, organization membership, and project/environment readiness. The portal uses nextStep to resume onboarding.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/onboarding/profile:
    patch: {description: 'Updates the authenticated developer profile during onboarding and returns refreshed onboarding status.', requestBody: {required: true, content: {application/json: {schema: {type: object, required: [displayName], properties: {displayName: {type: string, minLength: 2, maxLength: 120}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandbox/transactions:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
    get: {description: 'Sandbox-only fixed read endpoint for verifying a transactions:read API key. Requires Authorization: Bearer pgk_… bound to an active SANDBOX environment with an active sandbox. Returns persisted transaction records only (currently empty because transaction processing is not implemented) and never initiates payment execution.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/usage:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read usage for the API key bound project and environment. Requires the usage:read scope and the Base URL returned for the selected environment. Production keys must only be used by trusted backend systems.', parameters: [{name: from, in: query, schema: {type: string, format: date-time}}, {name: to, in: query, schema: {type: string, format: date-time}}, {name: granularity, in: query, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/organization:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Returns only the safe ID, name, and status of the organization bound to the authenticated API key. Requires organization:read; client-supplied tenant IDs are not accepted.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/project:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Returns project ID, name, organization ID, status, safe bound environment context, API version, and creation time. Requires project:read; client-supplied tenant IDs are not accepted.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/environment:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Returns safe ID, name, status, tier, and API version for the environment bound to the authenticated API key. Requires environment:read. Environment configuration and infrastructure details are never returned.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/auth/context:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Returns the authenticated key''s organization, project, environment tier, key type, status, and granted scopes. Requires api:read. Does not return the API key, secret, hash, or credentials.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/audit-events:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read project audit events. Requires the audit:read scope and the Base URL returned for the selected environment.', parameters: [{name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/events:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read events for the API key bound project. Requires the events:read scope and the Base URL returned for the selected environment.', parameters: [{name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/events/catalog:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read the event type catalog. Requires the events:read scope and the Base URL returned for the selected environment.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/events/subscriptions:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read event subscriptions for the API key bound project and environment. Requires the events:read scope and the Base URL returned for the selected environment.', parameters: [{name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/events/deliveries:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read event and webhook delivery attempts for the API key bound project and environment. Requires the events:read scope and the Base URL returned for the selected environment.', parameters: [{name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/key-data/webhooks:
    servers:
      - {url: 'https://sandbox-api.pesaguard.co.ke', description: Sandbox API (also used by DEVELOPMENT and STAGING environments)}
      - {url: 'https://api.pesaguard.co.ke', description: Production API}
    get: {description: 'Read webhook endpoints for the API key bound project. Requires the webhooks:read scope and the Base URL returned for the selected environment.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/notifications:
    get: {description: 'Lists saved notifications for the authenticated account and organization, including persisted read state. Results are newest first; page is zero-based and size is limited to 100.', parameters: [{name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/NotificationPage'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/notifications/{notificationId}/read:
    post: {description: 'Marks an account-owned notification as read. Notifications owned by another user or organization are indistinguishable from missing notifications.', parameters: [{name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Notification'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/notifications/read-all:
    post: {description: 'Marks all notifications for the authenticated account and organization as read. Returns the number of changed records and the timestamp applied.', responses: {'200': {$ref: '#/components/responses/NotificationsMarkedRead'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/notifications/preferences:
    get: {description: 'Returns saved notification channel preferences and categories with mandatory email delivery.', responses: {'200': {$ref: '#/components/responses/NotificationPreferences'}, '401': {$ref: '#/components/responses/Error'}}}
    put: {description: 'Replaces disabled category-level delivery channels. In-app delivery cannot be disabled, and email cannot be disabled for categories containing mandatory security or credential events.', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateNotificationPreferencesRequest'}}}}, responses: {'200': {$ref: '#/components/responses/NotificationPreferences'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/developer/preferences:
    get: {description: 'Returns persisted API Explorer request preferences and the authenticated developer account appearance preference. New accounts default to SYSTEM theme.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
    put: {description: 'Updates the authenticated developer account API Explorer timeout and safe GET retry preferences. Authorization is derived from the current session.', requestBody: {required: true, content: {application/json: {schema: {type: object, required: [requestTimeoutMs, retryCount], properties: {requestTimeoutMs: {type: integer, minimum: 1000, maximum: 60000}, retryCount: {type: integer, minimum: 0, maximum: 5}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/developer/preferences/appearance:
    patch: {description: 'Updates the authenticated developer account theme preference. expectedVersion provides stale-write detection; concurrent changes return 409. Theme changes do not affect authorization or security policy.', requestBody: {required: true, content: {application/json: {schema: {type: object, required: [theme, expectedVersion], properties: {theme: {type: string, enum: [SYSTEM, LIGHT, DARK]}, expectedVersion: {type: integer, minimum: 0}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/security/events/open:
    get: {description: 'Lists unresolved security signals for the active organization using bounded zero-based pagination. Requires security:read; the organization is always derived from the authenticated session.', parameters: [{name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}], responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/security/events/history:
    get: {description: 'Lists the active organization’s full security signal history, newest first. Requires security:read.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/security/events/{eventId}/resolve:
    post: {description: 'Resolves a signal for the active organization. Requires security:control; OPEN is not a valid resolution, and a human explanation is required and audited.', parameters: [{name: eventId, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [resolution, note], properties: {resolution: {type: string, enum: [DISMISSED, CONFIRMED, INVESTIGATING]}, note: {type: string, minLength: 1, maxLength: 1000}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/usage:
    get: {description: 'Returns usage totals and a time series for the authenticated organization. Requires usage:read. Defaults to the trailing 24 hours; ranges may not exceed 366 days. When apiKeyId is supplied, projectId and environmentId are required and results are limited to that key.', parameters: [{name: from, in: query, schema: {type: string, format: date-time}}, {name: to, in: query, schema: {type: string, format: date-time}}, {name: granularity, in: query, schema: {type: string, enum: [MINUTE, HOUR, DAY]}}, {name: projectId, in: query, schema: {type: string, format: uuid}}, {name: environmentId, in: query, schema: {type: string, format: uuid}}, {name: apiKeyId, in: query, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/usage/endpoints:
    get: {description: 'Lists endpoint paths called in the requested usage window. Results are tenant and project-access scoped. When apiKeyId is supplied, projectId and environmentId are required and results are limited to that key.', parameters: [{name: from, in: query, schema: {type: string, format: date-time}}, {name: to, in: query, schema: {type: string, format: date-time}}, {name: granularity, in: query, schema: {type: string, enum: [MINUTE, HOUR, DAY], default: HOUR}}, {name: projectId, in: query, schema: {type: string, format: uuid}}, {name: environmentId, in: query, schema: {type: string, format: uuid}}, {name: apiKeyId, in: query, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/usage/requests:
