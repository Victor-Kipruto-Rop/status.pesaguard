    Login: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
    Refresh: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
    ForgotPassword: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}}}}
    ResetPassword: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}
    ChangePassword: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}}
    MfaCode: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaCodeRequest'}}}}
    CreateOrganization: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}}}}
    UpdateOrganization: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateOrganizationRequest'}}}}
    VerifyOrganization: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyOrganizationRequest'}}}}
    TransferOwnership: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferOwnershipRequest'}}}}
    UpdateSecuritySettings: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSecuritySettingsRequest'}}}}
    CreateInvitation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInvitationRequest'}}}}
    UpdateMemberStatus: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMemberStatusRequest'}}}}
    ChangeMemberRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMemberRoleRequest'}}}}
    CreateProject: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProjectRequest'}}}}
    CreateEnvironment: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEnvironmentRequest'}}}}
    UpdateProject: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProjectRequest'}}}}
