    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}}
