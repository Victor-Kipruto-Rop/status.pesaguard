  /api/v1/projects/{projectId}/environments/{environmentId}/api-keys/{keyId}/resume:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/KeyId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/environments/{environmentId}/api-keys/{keyId}/rotate:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/KeyId'}], responses: {'201': {$ref: '#/components/responses/KeyCreated'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/environments/{environmentId}/api-keys/{keyId}/history:
    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/KeyId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/environments/{environmentId}/api-keys/{keyId}/name:
    put: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/KeyId'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 2, maxLength: 120}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing:
    get: {description: 'Returns only persisted invoice requests, invoices, payment attempts, configured-provider availability, and configured manual settlement instructions for the authenticated organization. Does not synthesize plans, prices, balances, or invoices.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/invoice-requests:
    post: {description: 'Requests an invoice without specifying or inventing a price. An operator must issue or decline the request.', requestBody: {required: true, content: {application/json: {schema: {type: object, required: [description], properties: {description: {type: string, minLength: 1, maxLength: 1000}}}}}}, responses: {'201': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/invoices/{invoiceId}/payments:
    post: {description: 'Starts a payment for an open invoice. Requires a fresh, unique Idempotency-Key per operation. Provider status, not the browser, determines settlement.', parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, format: uuid}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [provider], properties: {provider: {type: string, enum: [STRIPE, PAYHERO, DARAJA, AIRTEL_MONEY, MANUAL]}, phoneNumber: {type: string, maxLength: 32}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/payments/{paymentId}/refresh:
    post: {description: 'Queries the configured provider for the current payment status. A client callback or redirect is never treated as proof of settlement.', parameters: [{name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/payments/{paymentId}/retry:
    post: {description: 'Retries initiation only for an existing pending Stripe payment without a stored checkout reference, reusing the original provider idempotency key.', parameters: [{name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/payments/{paymentId}/cancel:
    post: {description: 'Cancels an awaiting manual settlement so the organization can choose another available option. Provider-backed payment attempts cannot be cancelled through this route.', parameters: [{name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/webhooks/stripe:
    post: {security: [], description: 'Stripe webhook. Sends the original request bytes with Stripe-Signature; event IDs are recorded for deduplication and signatures are freshness-checked.', parameters: [{name: Stripe-Signature, in: header, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'204': {description: Webhook accepted}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/webhooks/payhero:
    post: {security: [], description: 'PayHero callback notification. Callback fields are not accepted as payment proof; the backend queries the configured provider status API.', requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'204': {description: Callback processed}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/webhooks/daraja:
    post: {security: [], description: 'Daraja callback notification. The callback is used to identify the provider transaction; settlement is confirmed by a server-side status query.', requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'204': {description: Callback processed}, '400': {$ref: '#/components/responses/Error'}}}
  /api/v1/billing/webhooks/airtel-money:
    post: {security: [], description: 'Airtel Money callback notification. Callback data is used only to identify the transaction; settlement is confirmed by a server-side status query.', requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'204': {description: Callback processed}, '400': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/environments/{environmentId}/api-keys/{keyId}/restrictions:
    put: {description: 'Replaces the key IP/CIDR allowlist. An empty list removes the network restriction.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/KeyId'}], requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {ipAllowlist: {type: array, maxItems: 50, items: {type: string, example: 203.0.113.0/24}}}}}}}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/environments/{environmentId}/api-keys/{keyId}/compromise:
    post: {description: 'Immediately disables the key and records terminal COMPROMISED status and audit history.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/KeyId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/integrations/providers:
    get: {description: 'Returns the authenticated developer platform integration provider catalog. Availability is provider-support metadata, not a connection or health state. The project integration endpoints currently manage the PesaGuard API connection for each environment; third-party provider authorization remains unavailable.', responses: {'200': {$ref: '#/components/responses/IntegrationProviders'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/integrations/providers/{providerId}:
    get: {description: 'Returns provider metadata by stable provider identifier. Unknown providers return 404.', parameters: [{name: providerId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}], responses: {'200': {$ref: '#/components/responses/IntegrationProvider'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations:
    get: {description: 'Lists integrations for environments the authenticated user can read. Existing environments receive their default PesaGuard API integration on first access. Status and health are backend-owned; API key secrets are never returned.', parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}:
    get: {description: 'Returns an integration only when the caller can read its project and environment.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}/test:
    post: {description: 'Requires project manage and environment write access. Tests the active encrypted API key server-to-server against the fixed API host for the bound environment. The PesaGuard auth context must verify the environment and requires api:read; secrets and redirects are never returned or followed.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}/health:
    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}/tests:
    get: {description: 'Returns up to 100 recent connection test runs, newest first.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}/events:
    get: {description: 'Returns up to 100 recent integration events, newest first.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}/enable:
    post: {description: 'Enables the integration for users who can manage the project and write to its environment.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'204': {description: Integration enabled}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/integrations/{integrationId}/disable:
    post: {description: 'Disables the integration for users who can manage the project and write to its environment.', parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: integrationId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'204': {description: Integration disabled}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/audit-events:
