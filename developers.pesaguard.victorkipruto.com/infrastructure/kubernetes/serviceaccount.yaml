# ServiceAccount and minimal RBAC.
#
# A pod running as a service account inherits that account's permissions. The
# default account is usually more privileged than an application needs, so this
# binds an explicit one and grants nothing beyond token access.
#
# The application needs no Kubernetes API access at all. That is deliberate: a
# Role granting "get pods" today is the first step toward "get secrets" later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pesaguard-developer-platform
  labels:
    app.kubernetes.io/name: pesaguard-developer-platform
automountServiceAccountToken: false
---
# No Roles or RoleBindings are defined.
#
# autoProvisionServiceAccountToken is false on the ServiceAccount above, so no
# token is mounted into the pod filesystem at all. The application authenticates
# to PostgreSQL, Redis and the ingress with ordinary credentials, and has no
# business calling the Kubernetes API.
#
# If a future feature genuinely needs API access (for example, reading a mounted
# secret), it should get a narrowly scoped Role on a named resource rather than
# reusing this account:
#
#   apiVersion: rbac.authorization.k8s.io/v1
#   kind: Role
#   metadata:
#     name: pesaguard-read-own-config
#   rules:
#     - apiGroups: [""]
#       resources: ["configmaps"]
#       resourceNames: ["pesaguard-developer-platform-config"]
#       verbs: ["get"]