name: Notify docs of backend changes

on:
  push:
    branches: [main]
    paths:
      - "pesaguard_backend_pipeline/**"
      - "docs/api/openapi.json"
      - "requirements*.txt"
      - ".github/workflows/notify-docs.yml"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch API reference refresh
        if: ${{ env.DOCS_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ env.DOCS_DISPATCH_TOKEN }}
          repository: Victor-Kipruto-Rop/docs.pesaguard.victorkipruto.com
          event-type: backend-updated
          client-payload: '{"ref":"${{ github.sha }}"}'

      - name: Report missing dispatch token
        if: ${{ env.DOCS_DISPATCH_TOKEN == '' }}
        run: echo "::warning::DOCS_DISPATCH_TOKEN is not configured; the docs daily sync remains available."
