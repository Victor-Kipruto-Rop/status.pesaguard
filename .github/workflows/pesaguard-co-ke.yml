name: PesaGuard public site checks

on:
  push:
    paths:
      - "pesaguard.co.ke/**"
      - ".github/workflows/pesaguard-co-ke.yml"
  pull_request:
    paths:
      - "pesaguard.co.ke/**"
      - ".github/workflows/pesaguard-co-ke.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: pesaguard.co.ke

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pesaguard.co.ke/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check formatting
        run: npm run format:check
      - name: Lint source
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
