name: Public site checks

on:
  push:
    paths:
      - "public.pesaguard.victorkipruto.com/**"
      - ".github/workflows/public-site.yml"
  pull_request:
    paths:
      - "public.pesaguard.victorkipruto.com/**"
      - ".github/workflows/public-site.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: public.pesaguard.victorkipruto.com

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public.pesaguard.victorkipruto.com/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check types
        run: npm run typecheck
      - name: Lint application source
        run: npx eslint app components config content lib tests next.config.ts playwright.config.ts
      - name: Run unit and integration tests
        run: npm test
      - name: Build production site
        run: npm run build

  browser:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public.pesaguard.victorkipruto.com/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit msedge
      - name: Run browser and visual regression tests
        run: npm run test:e2e
