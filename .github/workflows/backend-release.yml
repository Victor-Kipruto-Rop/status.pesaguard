name: Backend release pipeline

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backend-release-pr-{0}', github.event.pull_request.number) || 'backend-release-deployment' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    name: Type-check and build developer platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developers.pesaguard.victorkipruto.com/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: developers.pesaguard.victorkipruto.com/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  verify:
    name: Verify backend and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pesaguard
          POSTGRES_PASSWORD: pesaguard
          POSTGRES_DB: pesaguard_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_ci
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .
      FLASK_ENV: test
      PESAGUARD_API_URL: https://api.pesaguard.co.ke
      JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
      DARAJA_SHARED_SECRET: ci-daraja-secret
      DARAJA_ALLOWED_IPS: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pesaguard_backend_pipeline/requirements_3.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements_3.txt alembic
      - name: Compile backend
        run: python -m compileall -q pesaguard_backend_pipeline
      - name: Apply migrations to PostgreSQL
        run: alembic -c pesaguard_backend_pipeline/alembic.ini upgrade head
      - name: Run complete backend test suite
        run: pytest -c pesaguard_backend_pipeline/pytest.ini -v --tb=short --durations=10

  build-scan-sbom:
    name: Build, scan, and retain SBOM
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - id: image
        name: Resolve image name
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repository}/backend" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pesaguard_backend_pipeline/infra/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            pesaguard-backend:ci
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the built image by digest
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the locally built pull-request image
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pesaguard-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/syft-installer@v0
        if: always() && steps.build.outcome == 'success'
        with:
          syft-version: latest
      - name: Generate SBOM for the exact built image
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'pesaguard-backend:ci' || format('{0}@{1}', steps.image.outputs.image, steps.build.outputs.digest) }}
        run: syft "$IMAGE" -o cyclonedx-json=backend-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('backend-sbom.cdx.json') != ''
        with:
          name: backend-sbom-${{ github.sha }}
          path: backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  staging:
    name: Deploy and verify staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    needs: build-scan-sbom
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy the scanned image digest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_REF: ${{ needs.build-scan-sbom.outputs.image }}@${{ needs.build-scan-sbom.outputs.digest }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Render API key is required"; exit 1; }
          test -n "$SERVICE_ID" || { echo "Staging Render service ID is required"; exit 1; }
          auth_header="$(printf 'Authorization: %s %s' 'Bearer' "$RENDER_API_KEY")"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "$auth_header" \
            -H 'Content-Type: application/json' --data "{\"imageUrl\":\"$IMAGE_REF\"}")"
          deploy_id="$(jq -r '.id // empty' <<< "$response")"
          test -n "$deploy_id" || { echo "Render did not return a staging deployment ID"; exit 1; }
          echo "Requested staging deployment $deploy_id for $IMAGE_REF"
          for attempt in $(seq 1 60); do
            deploy="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$deploy_id" \
              -H "$auth_header")"
            status="$(jq -r '.status // empty' <<< "$deploy")"
            echo "Staging deployment $deploy_id status: ${status:-unknown}"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Staging deployment failed with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Staging deployment $deploy_id did not become live"
          exit 1
      - name: Verify staging health
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "Staging health URL is required"; exit 1; }
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" 2>&1)"; then
              if python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "ok" else 1)' <<< "$response"; then
                exit 0
              fi
              echo "Staging health endpoint is responding but is not healthy: $response"
            else
              echo "Staging health request failed: $response"
            fi
            sleep 10
          done
          echo "Staging did not become healthy"
          exit 1

  production:
    name: Promote the staging-verified image to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-scan-sbom, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the same verified image digest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_REF: ${{ needs.build-scan-sbom.outputs.image }}@${{ needs.build-scan-sbom.outputs.digest }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Render API key is required"; exit 1; }
          test -n "$SERVICE_ID" || { echo "Production Render service ID is required"; exit 1; }
          auth_header="$(printf 'Authorization: %s %s' 'Bearer' "$RENDER_API_KEY")"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "$auth_header" \
            -H 'Content-Type: application/json' --data "{\"imageUrl\":\"$IMAGE_REF\"}")"
          deploy_id="$(jq -r '.id // empty' <<< "$response")"
          test -n "$deploy_id" || { echo "Render did not return a production deployment ID"; exit 1; }
          echo "Requested production deployment $deploy_id for $IMAGE_REF"
          for attempt in $(seq 1 60); do
            deploy="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$deploy_id" \
              -H "$auth_header")"
            status="$(jq -r '.status // empty' <<< "$deploy")"
            echo "Production deployment $deploy_id status: ${status:-unknown}"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Production deployment failed with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Production deployment $deploy_id did not become live"
          exit 1
      - name: Verify production health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "Production health URL is required"; exit 1; }
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" 2>&1)"; then
              if python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "ok" else 1)' <<< "$response"; then
                exit 0
              fi
              echo "Production health endpoint is responding but is not healthy: $response"
            else
              echo "Production health request failed: $response"
            fi
            sleep 10
          done
          echo "Production did not become healthy"
          exit 1
