name: pesaguard_analytics
version: "1.0.0"
config-version: 2

profile: pesaguard_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  pesaguard_analytics:
    staging:
      +materialized: view
      +tags: ["staging", "bronze"]
    intermediate:
      +materialized: table
      +tags: ["intermediate", "silver"]
    marts:
      +materialized: table
      +tags: ["marts", "gold"]

on-run-start:
  - "log('Starting PesaGuard analytics run', info=True)"
  - "{{ assert_tenant_isolation_enabled() }}"

on-run-end:
  - "log('PesaGuard analytics run complete', info=True)"
