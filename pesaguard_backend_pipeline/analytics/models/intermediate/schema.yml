version: 2

models:
  - name: int_transactions_enriched
    description: "Enriched transactions with discrepancy and reconciliation context."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: enriched_status
        tests:
          - not_null
          - accepted_values:
              values: ["received", "validated", "processing", "reconciling", "reconciled", "failed", "rejected", "flagged", "disputed"]

  - name: int_tenant_daily_summary
    description: "Daily tenant-level summary of volumes, failures, and reconciliation."
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: trans_date
        tests:
          - not_null
      - name: transaction_count
        tests:
          - not_null
      - name: reconciliation_rate
        tests:
          - not_null

  - name: int_reconciliation_outcomes
    description: "Categorized reconciliation match outcomes with latency buckets."
    columns:
      - name: match_id
        tests:
          - unique
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: match_category
        tests:
          - not_null
          - accepted_values:
              values: ["exact_match", "near_match", "partial_match", "mismatch"]
