# Data residency (Addendum III): set DEPLOYMENT_REGION, BACKUP_REGION, and LOG_REGION
# to the chosen hosting jurisdiction before go-live. See docs/product/DATA_RESIDENCY.md.
# Set explicit provider region identifiers before deployment. Do not use the
# logical ke-1 pilot label as proof of Kenyan data residency.

x-residency-env: &residency-env
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:?Set the approved provider deployment region}
  BACKUP_REGION: ${BACKUP_REGION:?Set the approved backup region}
  LOG_REGION: ${LOG_REGION:?Set the approved log region}

x-observability-env: &observability-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel_collector:4317}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pesaguard}
  PESAGUARD_SHARED_METRICS: ${PESAGUARD_SHARED_METRICS:-1}
  PROMETHEUS_MULTIPROC_DIR: /tmp/pesaguard-prometheus
  KAFKA_LAG_TOPICS: ${KAFKA_LAG_TOPICS:-pesaguard.transactions.raw,pesaguard.reconciliation.exceptions,pesaguard.notifications.requested}
  KAFKA_LAG_GROUPS: ${KAFKA_LAG_GROUPS:-reconciliation,communications}
  PYTHONPATH: /app:/app/pesaguard_backend_pipeline

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - dashboard_metrics_token
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alertmanager_webhook_secret
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    depends_on:
      - webhook_receiver

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  otel_collector:
    image: otel/opentelemetry-collector:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    volumes:
      - ../../monitoring/otel-collector.yaml:/etc/otel-collector.yaml:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.2
    container_name: pesaguard-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,PLAINTEXT://localhost:19092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:8082
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9644:9644"
    environment:
      <<: *residency-env
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  postgres:
    image: postgres:16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=${POSTGRES_ARCHIVE_COMMAND:-test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f}
    environment:
      <<: *residency-env
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  webhook_receiver:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["python", "pesaguard_backend_pipeline/app.py"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      PESAGUARD_API_URL: ${PESAGUARD_API_URL:?PESAGUARD_API_URL must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      PESAGUARD_BIND_HOST: ${PESAGUARD_BIND_HOST_DOCKER:?PESAGUARD_BIND_HOST_DOCKER must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      PESAGUARD_PROMETHEUS_TOKEN_FILE: /run/secrets/dashboard_metrics_token
      PESAGUARD_ALERTMANAGER_WEBHOOK_SECRET_FILE: /run/secrets/alertmanager_webhook_secret
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    secrets:
      - dashboard_metrics_token
      - alertmanager_webhook_secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/live', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  reconciliation_job:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    # Module invocation: bare sibling imports (environment, models, ...) and the
    # package-internal `from .x import y` forms only resolve on the PYTHONPATH
    # baked into the image (/app + /app/pesaguard_backend_pipeline). A relative
    # script path (python pesaguard_backend_pipeline/reconciliation_job.py) maps
    # the script directory -- not /app -- onto sys.path[0] and breaks startup.
    command: ["python", "-m", "pesaguard_backend_pipeline.reconciliation_job"]
    restart: unless-stopped
    # File-mtime liveness probe (Rule #40): the consumer has no HTTP port, so
    # run() touches PESAGUARD_RECONCILIATION_HEARTBEAT_FILE every loop pass.
    # The default matches HEARTBEAT_STALE_SECONDS (120s); keep both in sync.
    # No `test:`-only-DB tricks here: a wedged consumer must go unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time; p=os.getenv('PESAGUARD_RECONCILIATION_HEARTBEAT_FILE','/tmp/pesaguard-reconciliation.heartbeat'); s=max(1,int(os.getenv('PESAGUARD_RECONCILIATION_HEARTBEAT_STALE_SECONDS','120'))); raise SystemExit(0 if (time.time()-os.stat(p).st_mtime) < s else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dashboard_api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["uvicorn", "pesaguard_backend_pipeline.fastapi_app:app", "--host", "0.0.0.0", "--port", "5001"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      PESAGUARD_API_URL: ${PESAGUARD_API_URL:?PESAGUARD_API_URL must be set}
      PESAGUARD_PIPELINE_KEY_SYNC_SECRET: ${PESAGUARD_PIPELINE_KEY_SYNC_SECRET:-}
      PESAGUARD_PROMETHEUS_TOKEN_FILE: /run/secrets/dashboard_metrics_token
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    secrets:
      - dashboard_metrics_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/live', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  rq_worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["/bin/sh", "pesaguard_backend_pipeline/worker_entrypoint.sh"]
    restart: unless-stopped
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-transaction_events}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  scheduler_worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["/bin/sh", "pesaguard_backend_pipeline/worker_entrypoint.sh"]
    restart: unless-stopped
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      PESAGUARD_TENANT_REGISTRY_DATABASE_URL: ${PESAGUARD_TENANT_REGISTRY_DATABASE_URL_DOCKER:?Least-privilege tenant registry URL must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      SCHEDULER_WORKER_MODE: "1"
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-15}
      PESAGUARD_SCHEDULER_HEARTBEAT_FILE: /tmp/pesaguard-scheduler.heartbeat
      PESAGUARD_SCHEDULER_HEARTBEAT_STALE_SECONDS: ${PESAGUARD_SCHEDULER_HEARTBEAT_STALE_SECONDS:-120}
      PESAGUARD_ENVIRONMENT: ${PESAGUARD_ENVIRONMENT:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time; p=os.getenv('PESAGUARD_SCHEDULER_HEARTBEAT_FILE','/tmp/pesaguard-scheduler.heartbeat'); s=max(1,int(os.getenv('PESAGUARD_SCHEDULER_HEARTBEAT_STALE_SECONDS','120'))); raise SystemExit(0 if (time.time()-os.stat(p).st_mtime) < s else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  communications_worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    command: ["python", "-m", "pesaguard_backend_pipeline.communications.worker"]
    restart: unless-stopped
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      PESAGUARD_NOTIFICATION_TOPIC: ${PESAGUARD_NOTIFICATION_TOPIC:-pesaguard.notifications.requested}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  wal_archive:
  redpanda_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  dashboard_metrics_token:
    file: ${PESAGUARD_PROMETHEUS_TOKEN_FILE:?PESAGUARD_PROMETHEUS_TOKEN_FILE must point to a protected token file}
  alertmanager_webhook_secret:
    file: ${PESAGUARD_ALERTMANAGER_WEBHOOK_SECRET_FILE:?PESAGUARD_ALERTMANAGER_WEBHOOK_SECRET_FILE must point to a protected secret file}
