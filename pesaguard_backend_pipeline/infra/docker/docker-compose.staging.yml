version: '3.9'

# Data residency (Addendum III): keep DEPLOYMENT_REGION, BACKUP_REGION, and LOG_REGION
# set them to approved provider region identifiers; a logical label is not proof
# of data residency.

x-residency-env: &residency-env
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:?Set the approved provider deployment region}
  BACKUP_REGION: ${BACKUP_REGION:?Set the approved backup region}
  LOG_REGION: ${LOG_REGION:?Set the approved log region}

services:
  postgres-staging:
    image: postgres:16
    restart: unless-stopped
    environment:
      <<: *residency-env
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?STAGING_POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
  kafka-staging:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      <<: *residency-env
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: ${STAGING_KAFKA_ADVERTISED_LISTENERS:?STAGING_KAFKA_ADVERTISED_LISTENERS must be set}
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-staging:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_staging_data:/bitnami/kafka
  redis-staging:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    environment:
      <<: *residency-env
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_staging_data:/data

volumes:
  postgres_staging_data:
  kafka_staging_data:
  redis_staging_data:
