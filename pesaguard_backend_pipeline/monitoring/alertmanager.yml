global:
  resolve_timeout: 5m

# The secret is mounted into Alertmanager and webhook_receiver as a Docker
# secret. Alertmanager sends it as a bearer token; the receiver fails closed
# when the secret is missing, unreadable, too short, or incorrect.

route:
  receiver: pesaguard-default
  group_by: ['alertname', 'service', 'tenant_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts page on-call immediately via every configured channel.
    - matchers:
        - severity = "critical"
      receiver: pesaguard-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    # Warning alerts batch into the operator queue.
    - matchers:
        - severity = "warning"
      receiver: pesaguard-warning
      repeat_interval: 4h
    # Security alerts keep an audit trail even after paging.
    - matchers:
        - service = "security"
      receiver: pesaguard-security
      repeat_interval: 2h

receivers:
  - name: pesaguard-default
    webhook_configs:
      - url: http://webhook_receiver:5000/ops/alerts
        send_resolved: true
        http_config:
          bearer_token_file: /run/secrets/alertmanager_webhook_secret
  - name: pesaguard-critical
    webhook_configs:
      - url: http://webhook_receiver:5000/ops/alerts
        send_resolved: true
        http_config:
          bearer_token_file: /run/secrets/alertmanager_webhook_secret
  - name: pesaguard-warning
    webhook_configs:
      - url: http://webhook_receiver:5000/ops/alerts
        send_resolved: true
        http_config:
          bearer_token_file: /run/secrets/alertmanager_webhook_secret
  - name: pesaguard-security
    webhook_configs:
      - url: http://webhook_receiver:5000/ops/alerts
        send_resolved: true
        http_config:
          bearer_token_file: /run/secrets/alertmanager_webhook_secret

inhibit_rules:
  # A dead cluster suppresses its dependent service alerts.
  - source_matchers:
      - alertname = PesaGuardDatabaseExhaustion
    target_matchers:
      - service = "reconciliation"
    equal: ['service']
  - source_matchers:
      - alertname = PesaGuardKafkaConsumerLag
    target_matchers:
      - service = "event-processing"
